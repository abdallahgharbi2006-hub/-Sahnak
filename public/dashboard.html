<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة - صحنك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="/" data-i18n="logo">صحنك</a>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="langbar">
      <button class="langbtn" data-lang="ar" onclick="Sahnak.setLang('ar')">AR</button>
      <button class="langbtn" data-lang="en" onclick="Sahnak.setLang('en')">EN</button>
      <button class="langbtn" data-lang="fr" onclick="Sahnak.setLang('fr')">FR</button>
    </div>
    <a class="btn small ghost" href="/menu.html" target="_blank" data-i18n="preview_any_menu">معاينة أي منيو منشور</a>
  </div>
</div></header>

<div class="wrap" style="padding:24px 0 60px;">
  <div class="userbar" id="userbar">...</div>

  <div class="card">
    <h3 data-i18n="restaurant_info">بيانات المطعم (حسابك الخاص)</h3>
    <div class="row">
      <div><label data-i18n="lbl_rname">اسم المطعم</label><input id="rname" data-i18n-ph="ph_rname" placeholder="مقهى الدار"></div>
      <div><label data-i18n="lbl_rslug">الرابط المختصر</label><input id="rslug" placeholder="dar-cafe"></div>
    </div>
    <label data-i18n="lbl_rdesc">وصف مختصر (اختياري)</label>
    <textarea id="rdesc" rows="2" data-i18n-ph="ph_rdesc" placeholder="مقهى ومطعم يقدم المشروبات والفطور والحلويات"></textarea>
  </div>

  <div class="card">
    <h3 data-i18n="branding_title">تخصيص مظهر المنيو</h3>
    <label data-i18n="brand_color_label">لون الهوية (يُستخدم في رمز QR وألوان الصفحة)</label>
    <div class="color-row">
      <input type="color" id="brandColor" value="#e0632a">
      <span id="brandColorHex" style="font-family:monospace;color:var(--sub);">#e0632a</span>
    </div>

    <label data-i18n="cover_image_label" style="margin-top:16px;">صورة غلاف المنيو (اختياري)</label>
    <div class="cover-preview empty" id="coverPreview"><span data-i18n="cover_hint">ستظهر هذه الصورة كخلفية أعلى صفحة المنيو العامة.</span></div>
    <div class="row" style="margin-top:10px;">
      <input type="file" id="coverInput" accept="image/*" style="flex:2;">
      <button class="btn ghost small" id="removeCoverBtn" onclick="removeCover()" style="display:none;flex:0 0 auto;" data-i18n="btn_remove_cover">إزالة الصورة</button>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h3 style="margin:0" data-i18n="sections_title">أقسام المنيو والأصناف (الأسعار بالدينار التونسي)</h3>
      <button class="btn small" onclick="addSection()" data-i18n="btn_add_section">+ إضافة قسم</button>
    </div>
    <div id="sections"></div>
  </div>

  <div class="card">
    <div class="section-head">
      <div><span data-i18n="status_label">الحالة:</span> <span class="badge" id="statusBadge"></span></div>
      <button class="btn" id="publishBtn" onclick="togglePublish()"></button>
    </div>
    <div id="linkArea" style="margin-top:14px;"></div>
  </div>
  <div id="saveMsg" class="ok"></div>
</div>

<script src="/i18n.js"></script>
<script>
let restaurant = null;
const t = (k) => Sahnak.t(k);

async function boot(){
  const meRes = await fetch('/api/me', { credentials:'include' });
  if(!meRes.ok){ window.location.href = '/auth.html'; return; }
  const me = await meRes.json();
  if(!me.subscribed){ window.location.href = '/billing.html'; return; }
  renderUserbar(me.identifier);

  const rRes = await fetch('/api/restaurant', { credentials:'include' });
  restaurant = await rRes.json();
  document.getElementById('rname').value = restaurant.name || '';
  document.getElementById('rslug').value = restaurant.slug || '';
  document.getElementById('rdesc').value = restaurant.desc || '';
  document.getElementById('brandColor').value = restaurant.brandColor || '#e0632a';
  document.getElementById('brandColorHex').textContent = restaurant.brandColor || '#e0632a';
  renderCoverPreview();
  renderSections(); renderStatus(); renderLink();
}
function renderCoverPreview(){
  const box = document.getElementById('coverPreview');
  const removeBtn = document.getElementById('removeCoverBtn');
  if(restaurant.coverImage){
    box.classList.remove('empty');
    box.innerHTML = `<img src="${restaurant.coverImage}" alt="cover">`;
    removeBtn.style.display = 'inline-block';
  }else{
    box.classList.add('empty');
    box.innerHTML = `<span data-i18n="cover_hint">${t('cover_hint')}</span>`;
    removeBtn.style.display = 'none';
  }
}
document.getElementById('brandColor').addEventListener('input', function(){
  document.getElementById('brandColorHex').textContent = this.value;
});
document.getElementById('brandColor').addEventListener('change', function(){
  saveRestaurant({ brandColor: this.value }).then(renderLink);
});
document.getElementById('coverInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 3_000_000){ alert(t('err_IMAGE_TOO_LARGE')); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(){
    saveRestaurant({ coverImage: reader.result }).then(()=>{ renderCoverPreview(); });
  };
  reader.readAsDataURL(file);
});
function removeCover(){
  saveRestaurant({ coverImage: null }).then(renderCoverPreview);
}
function renderUserbar(identifier){
  document.getElementById('userbar').innerHTML =
    `<span>${t('logged_as')} <b style="color:var(--ink)">${escapeHtml(identifier)}</b> · <span style="color:var(--accent);font-weight:700;">${t('sub_badge')}</span></span>
     <button class="btn ghost small" onclick="logout()">${t('btn_logout')}</button>`;
}
async function logout(){
  await fetch('/api/logout', { method:'POST', credentials:'include' });
  window.location.href = '/';
}
function uid(){ return Date.now()+Math.floor(Math.random()*1000); }
function escapeAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function escapeHtml(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function saveRestaurant(extra){
  restaurant.name = document.getElementById('rname').value;
  restaurant.slug = document.getElementById('rslug').value.trim();
  restaurant.desc = document.getElementById('rdesc').value;
  Object.assign(restaurant, extra || {});
  const r = await fetch('/api/restaurant', {
    method:'PUT', headers:{'Content-Type':'application/json'}, credentials:'include',
    body: JSON.stringify(restaurant)
  });
  const data = await r.json();
  const msg = document.getElementById('saveMsg');
  if(!r.ok){ msg.className='err'; msg.textContent = Sahnak.err(data); return false; }
  restaurant = data;
  msg.className='ok'; msg.textContent=t('save_ok');
  setTimeout(()=> msg.textContent='', 1500);
  return true;
}
['rname','rslug','rdesc'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=> saveRestaurant());
});

function addSection(){ restaurant.sections.push({id:uid(), title: t('new_section'), items:[]}); saveRestaurant().then(renderSections); }
function removeSection(id){ restaurant.sections = restaurant.sections.filter(s=>s.id!==id); saveRestaurant().then(renderSections); }
function addItem(sid){ restaurant.sections.find(s=>s.id===sid).items.push({id:uid(), name:'', price:'0', desc:'', avail:true}); saveRestaurant().then(renderSections); }
function removeItem(sid,iid){ const s=restaurant.sections.find(s=>s.id===sid); s.items=s.items.filter(i=>i.id!==iid); saveRestaurant().then(renderSections); }
function updateSectionTitle(sid,val){ restaurant.sections.find(s=>s.id===sid).title=val; saveRestaurant(); }
function updateItem(sid,iid,field,val){ restaurant.sections.find(s=>s.id===sid).items.find(i=>i.id===iid)[field]=val; saveRestaurant(); }
function toggleAvail(sid,iid){ const it=restaurant.sections.find(s=>s.id===sid).items.find(i=>i.id===iid); it.avail=!it.avail; saveRestaurant().then(renderSections); }

function renderSections(){
  const wrap = document.getElementById('sections'); wrap.innerHTML='';
  if(restaurant.sections.length===0){ wrap.innerHTML='<div class="empty">'+t('empty_sections')+'</div>'; }
  restaurant.sections.forEach(s=>{
    const div = document.createElement('div'); div.className='section-block';
    div.innerHTML = `
      <div class="section-head">
        <input value="${escapeAttr(s.title)}" onchange="updateSectionTitle(${s.id}, this.value)">
        <div>
          <button class="iconbtn" onclick="addItem(${s.id})">${t('btn_add_item')}</button>
          <button class="iconbtn" onclick="removeSection(${s.id})">🗑</button>
        </div>
      </div>
      ${s.items.map(it=>`
        <div class="item">
          <div><input value="${escapeAttr(it.name)}" onchange="updateItem(${s.id},${it.id},'name',this.value)"></div>
          <div class="price"><input value="${escapeAttr(it.price)}" placeholder="${t('currency')}" onchange="updateItem(${s.id},${it.id},'price',this.value)"></div>
          <div><input placeholder="${t('ph_item_desc')}" value="${escapeAttr(it.desc)}" onchange="updateItem(${s.id},${it.id},'desc',this.value)"></div>
          <span class="pill ${it.avail?'on':'off'}" onclick="toggleAvail(${s.id},${it.id})">${it.avail?t('pill_avail'):t('pill_hidden')}</span>
          <button class="iconbtn" onclick="removeItem(${s.id},${it.id})">🗑</button>
        </div>
      `).join('') || '<div class="empty">'+t('empty_items')+'</div>'}
    `;
    wrap.appendChild(div);
  });
}
async function togglePublish(){
  if(!restaurant.slug){ alert(t('alert_need_slug')); return; }
  const ok = await saveRestaurant({ published: !restaurant.published });
  if(ok){ renderStatus(); renderLink(); }
}
function renderStatus(){
  const b = document.getElementById('statusBadge'); const btn = document.getElementById('publishBtn');
  if(restaurant.published){ b.textContent=t('status_pub'); b.className='badge pub'; btn.textContent=t('btn_unpublish'); }
  else{ b.textContent=t('status_draft'); b.className='badge draft'; btn.textContent=t('btn_publish'); }
}
function renderLink(){
  const area = document.getElementById('linkArea');
  if(!restaurant.published || !restaurant.slug){ area.innerHTML=''; return; }
  const link = window.location.origin + '/menu.html?slug=' + encodeURIComponent(restaurant.slug);
  const color = restaurant.brandColor || '#e0632a';
  area.innerHTML = `<label>${t('public_link')}</label><div class="linkbox"><span>${escapeHtml(link)}</span></div>
    <div class="qrwrap">
      <div class="qr-card" style="--qr-color:${color};">
        <div class="r-name">${escapeHtml(restaurant.name || t('lbl_rname'))}</div>
        <div class="qr-box" id="qrcode"></div>
        <div class="scan-caption">${t('scan_caption')}</div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <a class="btn ghost small" href="${link}" target="_blank">${t('btn_preview')}</a>
        <button class="btn small" onclick="downloadSticker()">${t('btn_download_sticker')}</button>
      </div>
      <div class="hint" style="text-align:center;">${t('sticker_hint')}</div>
    </div>`;
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'), { text: link, width:150, height:150, colorDark: color, colorLight:'#ffffff' });
}

async function downloadSticker(){
  const link = window.location.origin + '/menu.html?slug=' + encodeURIComponent(restaurant.slug);
  const color = restaurant.brandColor || '#e0632a';
  const name = restaurant.name || t('lbl_rname');

  // نولّد رمز QR بحجم أكبر في عنصر مؤقت غير ظاهر لاستخراج الصورة منه
  const hidden = document.createElement('div');
  hidden.style.position = 'fixed'; hidden.style.left = '-9999px';
  document.body.appendChild(hidden);
  new QRCode(hidden, { text: link, width: 360, height: 360, colorDark: color, colorLight: '#ffffff' });
  await new Promise(res => setTimeout(res, 60)); // مهلة قصيرة لإتمام رسم QRCode.js

  const qrImgEl = hidden.querySelector('canvas') || hidden.querySelector('img');
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }

  const W = 900, H = 1180;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // خلفية بيضاء وإطار مزخرف بلون الهوية
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = color; ctx.lineWidth = 14;
  ctx.strokeRect(24, 24, W-48, H-48);
  ctx.strokeStyle = color; ctx.globalAlpha = .35; ctx.lineWidth = 3;
  ctx.strokeRect(46, 46, W-92, H-92);
  ctx.globalAlpha = 1;

  // اسم المطعم
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.font = "900 56px Tajawal, sans-serif";
  wrapCanvasText(ctx, name, W/2, 160, W-160, 64);

  // رمز QR في المنتصف
  const qrSize = 560, qrX = (W - qrSize)/2, qrY = 300;
  ctx.fillStyle = '#fff'; ctx.fillRect(qrX-16, qrY-16, qrSize+32, qrSize+32);
  ctx.strokeStyle = '#eee2d6'; ctx.lineWidth = 2; ctx.strokeRect(qrX-16, qrY-16, qrSize+32, qrSize+32);
  if (qrImgEl) ctx.drawImage(qrImgEl, qrX, qrY, qrSize, qrSize);

  // نص الدعوة للمسح
  ctx.fillStyle = '#7a6a5c';
  ctx.font = "700 34px Tajawal, sans-serif";
  ctx.fillText(t('scan_caption'), W/2, qrY + qrSize + 80);

  // شعار صحنك أسفل الملصق
  ctx.fillStyle = color;
  ctx.font = "900 26px Tajawal, sans-serif";
  ctx.fillText(t('logo'), W/2, H - 60);

  document.body.removeChild(hidden);

  const a = document.createElement('a');
  a.download = (restaurant.slug || 'sahnak') + '-qr-sticker.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
function wrapCanvasText(ctx, text, cx, startY, maxWidth, lineHeight){
  const words = String(text).split(' ');
  let line = '', y = startY;
  const lines = [];
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  const totalH = (lines.length-1) * lineHeight;
  y = startY - totalH/2 + lineHeight/2;
  lines.forEach(l => { ctx.fillText(l, cx, y); y += lineHeight; });
}
document.addEventListener('sahnak:lang-changed', function(){
  if(!restaurant) return;
  renderSections(); renderStatus(); renderLink();
  fetch('/api/me', { credentials:'include' }).then(r=>r.json()).then(me=> renderUserbar(me.identifier));
});
boot();
</script>
</body>
</html>
