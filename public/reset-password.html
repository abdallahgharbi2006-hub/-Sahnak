<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعيين كلمة مرور جديدة - صحنك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="/" data-i18n="logo">صحنك</a>
  <div class="langbar">
    <button class="langbtn" data-lang="ar" onclick="Sahnak.setLang('ar')">AR</button>
    <button class="langbtn" data-lang="en" onclick="Sahnak.setLang('en')">EN</button>
    <button class="langbtn" data-lang="fr" onclick="Sahnak.setLang('fr')">FR</button>
  </div>
</div></header>
<div class="wrap auth-wrap">
  <h2 style="margin-bottom:4px;" data-i18n="reset_title">تعيين كلمة مرور جديدة</h2>
  <div class="card" id="formCard">
    <label data-i18n="reset_pass1">كلمة المرور الجديدة</label>
    <input id="pass1" type="password" data-i18n-ph="ph_pass" placeholder="8 أحرف على الأقل">
    <label data-i18n="reset_pass2">تأكيد كلمة المرور</label>
    <input id="pass2" type="password" data-i18n-ph="ph_pass2" placeholder="أعد كتابة كلمة المرور">
    <button class="btn" style="width:100%;margin-top:14px;" onclick="submitReset()" data-i18n="btn_reset">تعيين كلمة المرور</button>
    <div id="err" class="err"></div>
  </div>
  <div class="card" id="okCard" style="display:none;">
    <p style="margin:0;" data-i18n="reset_ok">تم تغيير كلمة المرور بنجاح ✅</p>
    <a class="btn" style="width:100%;margin-top:14px;display:block;text-align:center;" href="/auth.html" data-i18n="btn_login_now">تسجيل الدخول الآن</a>
  </div>
  <div class="card" id="invalidCard" style="display:none;">
    <p style="margin:0;color:#c93b3b;" data-i18n="reset_invalid">هذا الرابط غير صالح أو منتهي الصلاحية.</p>
    <a class="btn ghost" style="width:100%;margin-top:14px;display:block;text-align:center;" href="/auth.html" data-i18n="btn_back_to_login">العودة لتسجيل الدخول</a>
  </div>
</div>
<script src="/i18n.js"></script>
<script>
const t = (k) => Sahnak.t(k);
const token = new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('invalidCard').style.display = 'block';
}
async function submitReset(){
  const password = document.getElementById('pass1').value;
  const confirmPassword = document.getElementById('pass2').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try{
    const r = await fetch('/api/password/reset', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password, confirmPassword })
    });
    const data = await r.json();
    if(!r.ok){ err.textContent = Sahnak.err(data); return; }
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('okCard').style.display = 'block';
  }catch(e){ err.textContent = t('err_server'); }
}
</script>
</body>
</html>
