<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنيو - صحنك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="wrap nav" style="max-width:480px;">
  <a class="logo" href="/" data-i18n="logo" style="font-size:18px;">صحنك</a>
  <div class="langbar">
    <button class="langbtn" data-lang="ar" onclick="Sahnak.setLang('ar')">AR</button>
    <button class="langbtn" data-lang="en" onclick="Sahnak.setLang('en')">EN</button>
    <button class="langbtn" data-lang="fr" onclick="Sahnak.setLang('fr')">FR</button>
  </div>
</div></header>
<div class="wrap public-page" id="wrap" style="padding-top:20px;">...</div>
<script src="/i18n.js"></script>
<script>
const t = (k) => Sahnak.t(k);
function escapeHtml(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
let menuData = null;

async function load(){
  const slug = new URLSearchParams(window.location.search).get('slug');
  const wrap = document.getElementById('wrap');
  if(!slug){ wrap.innerHTML = '<div class="empty" id="noSlugMsg">'+t('menu_no_slug')+'</div>'; return; }
  const r = await fetch('/api/public/' + encodeURIComponent(slug));
  if(!r.ok){ wrap.innerHTML = '<div class="empty" id="notPubMsg">'+t('menu_not_published')+'</div>'; return; }
  menuData = await r.json();
  render();
}
function render(){
  const wrap = document.getElementById('wrap');
  if(!menuData) return;
  const m = menuData;
  const color = m.brandColor || '#e0632a';
  const coverHtml = m.coverImage
    ? `<img class="menu-cover-img" src="${m.coverImage}" alt="">`
    : `<div class="menu-cover" style="background:linear-gradient(135deg,${color},#f2955f);"></div>`;
  wrap.innerHTML = `
    ${coverHtml}
    <div class="menu-head">
      <h2 style="margin:6px 0 2px;color:${color};">${escapeHtml(m.name||t('lbl_rname'))}</h2>
      <p style="color:var(--sub);margin:0;font-size:13px;">${escapeHtml(m.desc||'')}</p>
    </div>
    ${m.sections.map(s=>`
      <div class="menu-section-title" style="color:${color};">${escapeHtml(s.title)}</div>
      ${s.items.map(it=>`
        <div class="menu-item ${it.avail?'':'unavail'}">
          <div><h4 style="margin:0 0 4px;font-size:15px;">${escapeHtml(it.name)}</h4>
            <p style="margin:0;color:var(--sub);font-size:13px;">${escapeHtml(it.desc)}</p></div>
          <div class="p" style="color:${color};">${escapeHtml(it.price)} ${t('currency')}</div>
        </div>
      `).join('')}
    `).join('')}
  `;
}
document.addEventListener('sahnak:lang-changed', function(){
  if(menuData) render();
});
load();
</script>
</body>
</html>
